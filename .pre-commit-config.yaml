# Pre-commit hooks for virons MCP servers
# Install: pre-commit install

repos:
  # Standard Python hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Virons-specific compliance hooks
  - repo: local
    hooks:
      # BaFin MaRisk AT 8.1 - Audit pattern validation
      - id: bafin-audit-pattern
        name: BaFin AT 8.1 - Audit Trail Pattern
        entry: python3 scripts/hooks/check_audit_pattern.py
        language: system
        files: ^src/virons-.*/.*\.py$
        pass_filenames: true

      # GDPR Art 25 - Data residency check
      - id: gdpr-data-residency
        name: GDPR Art 25 - Data Residency
        entry: python3 scripts/hooks/check_data_residency.py
        language: system
        files: ^src/virons-.*/.*compliance\.py$
        pass_filenames: true

      # Virons license header check
      - id: virons-license-header
        name: Virons License Header
        entry: python3 scripts/hooks/check_license_header.py
        language: system
        files: ^src/virons-.*/.*\.py$
        pass_filenames: true

      # EU AI Act - Model card check for high-risk servers
      - id: euai-model-cards
        name: EU AI Act - Model Cards
        entry: python3 scripts/hooks/check_model_cards.py
        language: system
        files: ^src/virons-(anomaly-detector|grandmaster)-.*/
        pass_filenames: false

  # Pyright type checking (pre-push only)
  - repo: local
    hooks:
      - id: pyright
        name: Pyright Type Check
        entry: bash -c 'cd src/virons-common && uv run pyright'
        language: system
        stages: [pre-push]
        pass_filenames: false

  # Pytest (pre-push only)
  - repo: local
    hooks:
      - id: pytest-virons
        name: Pytest Virons Servers
        entry: python3 scripts/hooks/run_virons_tests.py
        language: system
        stages: [pre-push]
        pass_filenames: false
