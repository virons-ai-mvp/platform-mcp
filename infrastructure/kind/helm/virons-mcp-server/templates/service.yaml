apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.server.name }}-mcp-server
  namespace: virons
  labels:
    app: {{ .Values.server.name }}-mcp-server
    virons.ai/type: mcp-server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.server.name }}-mcp-server
