name: Compliance Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  compliance-gate:
    name: Compliance Gate
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - sast-python
      - container-scan
      - dependency-scan

    steps:
      - name: All checks passed
        run: |
          echo "✅ All compliance checks passed"
          echo "Regulatory coverage: GDPR Art 32 · BaFin MaRisk AT 8.1 · DORA Art 11"

      - name: Post compliance scorecard
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const body = `## ✅ Compliance Gate — All Checks Passed

            | Check | Status | Regulation |
            |-------|--------|------------|
            | gitleaks secret scan | ✅ | GDPR Art 32 |
            | bandit SAST (Python) | ✅ | BaFin AT 8.1 |
            | trivy container scan | ✅ | DORA Art 11 |
            | dependency review | ✅ | DORA Art 11 |

            **Regulatory coverage:** GDPR Art 32 · BaFin MaRisk AT 8.1 · DORA Art 11`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-python:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: bandit -r src/ -f sarif -o bandit.sarif || true

      - uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3
        if: always()
        with:
          sarif_file: bandit.sarif

  container-scan:
    name: Container Scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'

      - uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3
        if: always()
        with:
          sarif_file: trivy.sarif

  dependency-scan:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1541a4984c76d921601d7c # v4
