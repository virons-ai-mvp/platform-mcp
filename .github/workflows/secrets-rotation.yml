name: secrets-rotation

on:
  schedule:
    - cron: '0 2 1 * *'  # Monthly at 2 AM on 1st
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-secret-age:
    name: Check Secret Age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for potential hardcoded secrets..."

          # Check for common secret patterns
          if grep -r "password\s*=\s*['\"]" src/ 2>/dev/null | grep -v "test" | grep -v "example"; then
            echo "⚠️  Found potential hardcoded passwords"
          fi

          if grep -r "api[_-]key\s*=\s*['\"]" src/ 2>/dev/null | grep -v "test" | grep -v "example"; then
            echo "⚠️  Found potential hardcoded API keys"
          fi

          echo "✅ Secret scan complete"

      - name: Check AWS secrets rotation
        run: |
          echo "📋 AWS Secrets to rotate:"
          echo "  - ECR credentials (auto-rotated by AWS)"
          echo "  - EKS service account tokens (auto-rotated by K8s)"
          echo "  - GitHub Actions OIDC (no rotation needed)"
          echo ""
          echo "✅ All AWS secrets use auto-rotation or OIDC"

      - name: Check GitHub secrets
        run: |
          echo "📋 GitHub Secrets inventory:"
          echo "  - GITHUB_TOKEN (auto-rotated per workflow)"
          echo "  - AWS_ROLE_ARN (OIDC, no secret)"
          echo ""
          echo "✅ No manual GitHub secrets requiring rotation"

  create-rotation-reminder:
    name: Create Rotation Reminder
    runs-on: ubuntu-latest
    needs: check-secret-age
    if: github.event_name == 'schedule'
    steps:
      - name: Create issue for manual review
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const title = `🔐 Monthly Secret Rotation Review - ${new Date().toISOString().slice(0, 7)}`;
            const body = `## Monthly Secret Rotation Review

            **DORA Art 11 Compliance**: Regular secret rotation required

            ### Automated Rotations ✅
            - ECR credentials: Auto-rotated by AWS
            - EKS service account tokens: Auto-rotated by Kubernetes
            - GitHub Actions tokens: Auto-rotated per workflow

            ### Manual Review Required
            - [ ] Review AWS IAM roles and policies
            - [ ] Verify OIDC trust relationships
            - [ ] Check for any new secrets added this month
            - [ ] Validate secret access logs in CloudTrail

            ### Compliance Checklist
            - [ ] BaFin AT 8.1: Audit trail reviewed
            - [ ] GDPR Art 32: Security measures validated
            - [ ] DORA Art 11: ICT risk management confirmed

            **Action Required**: Platform team to review and close this issue.

            ---
            *Auto-generated by secrets-rotation workflow*`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,compliance'
            });

            const exists = issues.data.some(issue => issue.title === title);

            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'compliance', 'dora-art-11']
              });
              console.log('✅ Created rotation reminder issue');
            } else {
              console.log('ℹ️  Rotation reminder already exists');
            }

  validate-oidc-config:
    name: Validate OIDC Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check OIDC best practices
        run: |
          echo "🔍 Validating OIDC configuration..."

          # Check for OIDC usage in workflows
          if grep -r "aws-actions/configure-aws-credentials" .github/workflows/*.yml | grep -q "role-to-assume"; then
            echo "✅ Using OIDC for AWS authentication"
          else
            echo "⚠️  No OIDC configuration found"
          fi

          echo "✅ OIDC validation complete"
