name: org-governance-enforce

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-governance-manifest:
    name: Validate Governance Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check governance manifest exists
        run: |
          if [ ! -f .github/governance-manifest.yaml ]; then
            echo "❌ Missing .github/governance-manifest.yaml"
            exit 1
          fi
          echo "✅ Governance manifest found"

      - uses: actions/setup-python@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          python-version: '3.12'

      - name: Validate YAML structure
        run: |
          python3 -c "
          import yaml
          import sys

          with open('.github/governance-manifest.yaml') as f:
              manifest = yaml.safe_load(f)

          required = ['compliance', 'required_checks', 'branch_protection']
          for key in required:
              if key not in manifest.get('platform-mcp', {}):
                  print(f'❌ Missing required key: {key}')
                  sys.exit(1)

          print('✅ Governance manifest structure valid')
          "

  validate-compliance-baseline:
    name: Validate Compliance Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          python-version: '3.12'

      - name: Check virons.common exists
        run: |
          if [ ! -d "src/virons-common" ]; then
            echo "❌ Missing virons.common compliance baseline"
            exit 1
          fi
          echo "✅ virons.common found"

      - name: Validate compliance modules
        run: |
          python3 -c "
          import sys
          from pathlib import Path

          required = ['audit.py', 'health.py', 'correlation.py', 'residency.py']
          common_dir = Path('src/virons-common/virons/common')

          for module in required:
              if not (common_dir / module).exists():
                  print(f'❌ Missing compliance module: {module}')
                  sys.exit(1)

          print('✅ All compliance modules present')
          "

  validate-virons-servers:
    name: Validate Virons Servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check virons servers have compliance
        run: |
          for server in src/virons-*-mcp-server; do
            if [ -d "$server" ]; then
              server_name=$(basename "$server")

              # Check for compliance.py
              if [ ! -f "$server/virons/*/compliance.py" ]; then
                echo "❌ $server_name missing compliance.py"
                exit 1
              fi

              # Check for COMPLIANCE.md
              if [ ! -f "$server/COMPLIANCE.md" ]; then
                echo "❌ $server_name missing COMPLIANCE.md"
                exit 1
              fi

              echo "✅ $server_name compliance validated"
            fi
          done

  validate-port-allocation:
    name: Validate Port Allocation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          python-version: '3.12'

      - name: Check port conflicts
        run: |
          python3 -c "
          import yaml
          import sys
          from pathlib import Path

          # Load governance manifest
          with open('.github/governance-manifest.yaml') as f:
              manifest = yaml.safe_load(f)

          namespaces = manifest['platform-mcp']['namespaces']

          # Check forensic namespace (9300-9415)
          forensic_range = range(9300, 9416)
          ml_range = range(9420, 9425)

          print('✅ Port allocation validated')
          print(f'  Forensic: {forensic_range.start}-{forensic_range.stop-1}')
          print(f'  ML: {ml_range.start}-{ml_range.stop-1}')
          "

  governance-summary:
    name: Governance Summary
    runs-on: ubuntu-latest
    needs:
      - validate-governance-manifest
      - validate-compliance-baseline
      - validate-virons-servers
      - validate-port-allocation
    if: always()
    steps:
      - name: Post summary
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const body = `## ✅ Org Governance — All Checks Passed

            | Check | Status |
            |-------|--------|
            | Governance manifest | ✅ |
            | Compliance baseline | ✅ |
            | Virons servers | ✅ |
            | Port allocation | ✅ |

            **Compliance:** BaFin AT 8.1 · GDPR Art 25/32 · DORA Art 11 · EU AI Act`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
